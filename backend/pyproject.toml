[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.1.0"
description = "Local backtesting workbench for MetaTrader 5 strategies."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.0",
    "lxml==6.1.3",
    "MetaTrader5==5.0.6231",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "psutil==7.2.2",
    "pyarrow==26.0.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["strategylab*"]
